name: build-mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Encontrar projeto
        run: |
          if [ -f build.gradle ]; then
            PROJ="."
          else
            ZIP=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: Nenhum ZIP encontrado!"
              exit 1
            fi

            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted

            BUILD=$(find extracted -name build.gradle -type f | head -n 1)

            if [ -z "$BUILD" ]; then
              echo "ERRO: build.gradle não encontrado!"
              exit 1
            fi

            PROJ=$(dirname "$BUILD")
          fi

          echo "Projeto encontrado em: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Instalar Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: |
          $GITHUB_WORKSPACE/gradle-4.9/bin/gradle setupCIWorkspace build --no-daemon

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: observador-jar
          path: ${{ env.PROJ }}/build/libs/*.jar
          if-no-files-found: error
