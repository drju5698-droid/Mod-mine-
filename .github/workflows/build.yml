
name: build-mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Achar o projeto (pasta solta OU zip na raiz do repositorio)
        run: |
          if [ -f build.gradle ]; then
            echo "PROJ=." >> $GITHUB_ENV
          else
            unzip -q -o "$(ls *.zip | head -n 1)"
            echo "PROJ=observador-mod" >> $GITHUB_ENV
          fi
      - name: Instalar Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip
      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: $GITHUB_WORKSPACE/gradle-4.9/bin/gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: observador-jar
          path: ${{ env.PROJ }}/build/libs/*.jar
